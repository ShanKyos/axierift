<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Axie Rift — Spellblade movement lab</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    :root { color-scheme: dark; --gold:#e0b64f; --ink:#110d0b; --panel:rgba(21,15,11,.9); }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#15100b; font-family:"Baloo 2",system-ui,sans-serif; }
    canvas { display:block; width:100%; height:100%; image-rendering:auto; }
    .hud { position:fixed; inset:16px auto auto 16px; width:min(360px,calc(100vw - 32px)); padding:14px 16px 13px;
      border:1px solid #725725; border-radius:14px; background:linear-gradient(180deg,rgba(38,28,17,.95),var(--panel));
      box-shadow:0 12px 34px #0009, inset 0 0 0 1px #d6a84922; color:#f6ecd5; user-select:none; }
    h1 { margin:0; color:#ffe2a0; font-size:18px; line-height:1.1; letter-spacing:.02em; }
    .sub { margin:3px 0 10px; color:#c8b997; font:600 12px/1.25 system-ui,sans-serif; }
    .row { display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
    button { min-height:34px; padding:6px 11px; border:1px solid #7a6132; border-radius:9px; color:#eadbbd;
      background:linear-gradient(#342718,#20170f); font:700 13px/1 system-ui,sans-serif; cursor:pointer; }
    button:hover { border-color:#c79a43; }
    button.on { color:#1b1209; background:linear-gradient(#f5d277,#bd8733); border-color:#ffe8a7; }
    .switch { display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:9px; border-top:1px solid #8c6a302f; }
    .switch label { color:#dfd0b2; font:700 13px system-ui,sans-serif; }
    input[type=checkbox] { width:38px; height:20px; accent-color:#d8a640; }
    .status { position:fixed; left:50%; top:17px; transform:translateX(-50%); padding:7px 16px; border:1px solid #d0a54866;
      border-radius:999px; color:#ffe3a1; background:#191109d9; box-shadow:0 6px 22px #0007; font:800 13px system-ui,sans-serif; }
    .help { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); white-space:nowrap; padding:8px 14px;
      border-radius:10px; color:#eadcbc; background:#160f0bcf; border:1px solid #7e62365c; font:650 12px system-ui,sans-serif; }
    .badge { color:#bba87f; }
    .gear { margin-top:9px; padding:8px 10px; border-radius:9px; color:#e8d6ad; background:#0d0907aa;
      border:1px solid #6c512b66; font:700 12px/1.35 system-ui,sans-serif; }
    .picker { display:grid; grid-template-columns:72px 1fr; align-items:center; gap:8px; margin-top:8px; color:#dfd0b2;
      font:700 13px system-ui,sans-serif; }
    select { width:100%; min-height:32px; border:1px solid #725725; border-radius:8px; color:#f5e4c3; background:#17100b;
      padding:4px 8px; font:700 12px system-ui,sans-serif; }
    @media(max-width:680px){ .hud{transform:scale(.87);transform-origin:top left}.status{top:auto;bottom:58px}.help{font-size:10px} }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <section class="hud" aria-label="Điều khiển demo">
    <h1>Magic · Modular Runtime Lab</h1>
    <p class="sub">7 giáp × 7 vũ khí · Idle / Walk / Run / Attack · 8 hướng × 8 frame</p>
    <div class="row" id="states">
      <button data-state="idle">Idle</button>
      <button data-state="walk" class="on">Walk</button>
      <button data-state="run">Run</button>
      <button data-state="attack">Attack</button>
      <button data-state="control">Tự điều khiển</button>
    </div>
    <div class="row" id="directions"></div>
    <div class="picker"><label for="armor-select">Bộ giáp</label><select id="armor-select"></select></div>
    <div class="picker"><label for="weapon-select">Vũ khí</label><select id="weapon-select"></select></div>
    <div class="row"><button id="random-gear">🎲 Random giáp + vũ khí</button></div>
    <div class="gear" id="gear-info">Đang tải loadout…</div>
    <div class="switch"><label for="weapon">Trang bị song vũ khí</label><input id="weapon" type="checkbox" checked></div>
    <div class="switch"><label for="safe-zone">Trong thành an toàn · đao vắt lưng</label><input id="safe-zone" type="checkbox"></div>
    <div class="switch"><label for="sockets">Hiện socket bàn tay</label><input id="sockets" type="checkbox"></div>
  </section>
  <div class="status" id="status">Đang tải Magic runtime…</div>
  <div class="help"><span class="badge">WASD / phím mũi tên</span> để đi · <span class="badge">Shift</span> để chạy · <span class="badge">V</span> vũ khí · <span class="badge">Z</span> vùng an toàn</div>
  <script src="proto_magic_mix.js"></script>
</body>
</html>
