<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Game chỉ chạy trên PC. maximum-scale + user-scalable=no là chỉ thị chỉ có tác dụng trên
     thiết bị chạm, và tác dụng duy nhất của nó ở đây là CHẶN phóng to — kể cả trên laptop
     màn hình chạm, kể cả với người cần phóng to để đọc. Bỏ. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axie Rift (PvE Webgame)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<!-- Bộ chữ tự chứa. Bản trước gọi thẳng fonts.googleapis.com — một bảng kiểu CHẶN VẼ
     do bên thứ ba giữ, nằm ngay trên đường tới hạn của trang. Xem fonts.css. -->
<!-- Chữ thân trang là Be Vietnam Pro 400. Tiếng Việt cần CẢ HAI tập: chữ cái nền lấy từ
     tập latin, còn các chữ có dấu lấy từ tập vietnamese — thiếu một là nhấp nháy nửa chừng. -->
<link rel="preload" href="fonts/QdVPSTAyLFyeg_IDWvOJmVES_Hw3BXo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/QdVPSTAyLFyeg_IDWvOJmVES_Hw4BXoKZA.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- ═══════════ MÀN TẢI ═══════════
     Trước bản này KHÔNG có màn tải nào: cảnh Lunacia mười lớp lắp dần ngay trước mắt người
     chơi — trời hiện trước, núi hiện sau, nhân vật hiện cuối. Trên mạng chậm nó trông như hỏng.

     ⚠ THANH NÀY CÂN THEO SỐ BYTE THẬT, không theo số tệp và tuyệt đối không theo đồng hồ.
     Bản kê nằm ở data/taitro.js, sinh bằng tools/title/liet_ke_taitro.cjs từ chính kích thước
     tệp trên đĩa. Một thanh chạy theo setTimeout là đúng cái thứ mà dự án này đã gỡ một lần rồi
     (thanh "Tiếp nhận 28%…82%" ở màn chọn máy chủ) — xem QUY TẮC ở CLAUDE.md. -->
<div id="preload">
  <div class="pl-inner">
    <div class="sv-logo"><span class="sv-logo-a">AXIE</span><span class="sv-logo-b">RIFT</span></div>
    <div class="pl-bar"><i id="pl-fill"></i></div>
    <div class="pl-hang"><span id="pl-nhom">Đang mở vết nứt…</span><b id="pl-pct">0%</b></div>
    <div class="pl-byte" id="pl-byte"></div>
    <div class="pl-tip" id="pl-tip"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hud-left">
    <!-- KHUNG CHÂN DUNG. Trước bản này góc trên trái chỉ có một dòng tên trần, còn Sinh Lực và
         Mana là hai viên cầu ở HAI ĐẦU thanh chiến đấu. Chủ dự án chốt đổi sang khuôn quen
         thuộc hơn: chân dung + tên + cấp + hai thanh, gom về một khối ở góc trái.
         ⚠ GIỮ NGUYÊN id `orb-hp` / `bar-hp` / `txt-hp` (và bộ qi) dù nay chúng là THANH chứ
         không còn là viên cầu: hai bài kiểm và sáu chỗ trong updateHud() gọi thẳng mấy id đó.
         Đổi tên id chỉ để cho "đúng chữ" là trả một cái giá thật để mua một thứ không ai thấy. -->
    <!-- HÀNG ĐẦU HUD: chân dung ⇄ khung Lực Chiến. Chủ dự án chốt "cho nó ra ngoài hẳn 1 UI
         kế bên thanh máu" — trước đó nút nằm TRONG `#cd-phai`, tức chen vào cùng cột với hai
         thanh máu/mana và ăn mất chiều cao của chúng. Nay là một khung RIÊNG, có vành đồng
         của chính nó, đứng cạnh chứ không lồng vào.
         ⚠ Bọc bằng `#hud-dau` chứ đừng cho `#lc-khung` nổi tự do bằng toạ độ tuyệt đối: khung
         chân dung co theo `40vw`, nên một con số px cố định sẽ rời khỏi nó ở màn hẹp. -->
    <div id="hud-dau">
    <div id="chan-dung">
      <div id="cd-khung">
        <canvas id="cd-ava" width="128" height="128"></canvas>
        <img id="cd-lop" alt="">
      </div>
      <div id="cd-phai">
        <div id="cd-dau"><div id="hud-name">—</div><b id="hud-lv">LV.1</b></div>
        <div class="cd-thanh cd-hp" id="orb-hp" title="Sinh Lực"><i class="fill" id="bar-hp"></i><span id="txt-hp"></span></div>
        <div class="cd-thanh cd-qi" id="orb-qi" title="Mana"><i class="fill" id="bar-qi"></i><span id="txt-qi"></span></div>
      </div>
    </div>
    <!-- KHUNG LỰC CHIẾN — một UI riêng, không phải một cái chip nhét vào khung chân dung.
         Nút Quà ở chung khung vì hai thứ trả lời hai nửa của cùng một câu: "mình mạnh tới đâu"
         và "có gì để nhận". Chấm đỏ trên nút Quà là cửa DUY NHẤT báo có mốc đang chờ. -->
    <div id="lc-khung">
      <button id="btn-lc" title="Đánh Giá Sức Chiến Đấu — bấm xem phân rã" onclick="moLucChien()">
        <i>◉</i><span>Lực Chiến</span><b id="lc-so-hud">0</b></button>
      <button id="btn-qua" title="Nhận Quà — bấm xem các mốc đang chờ" onclick="togglePanel('qua')">
        <i>🎁</i><span>Nhận Quà</span><b id="lc-cham-qua" class="hidden">0</b></button>
    </div>
    </div>
    <!-- Số Bình Thuốc đã dời xuống ô thuốc trong thanh chiến đấu (#sk-thuoc) — cùng một con
         số bày hai chỗ thì chỗ nào cũng bị liếc qua, mà không chỗ nào được tin. -->
    <!-- ⚠ `#hud-buff` / `#hud-loidon` ĐÃ GỠ — chúng nói ra đúng 2/13 trạng thái và đứng ở
         góc trái, xa chỗ mắt đang nhìn. Cả mười ba nay ở dải `#trang-thai` trong cột PHẢI.
         Gỡ khối HTML thì phải soát mọi `getElementById` trỏ vào nó: hai chỗ trong
         `updateHud()` đã gỡ cùng lượt (vết sẹo `btn-music` đã ghi trong CLAUDE.md). -->
    <!-- Đồng hồ và nút loa đứng CÙNG MỘT HÀNG: cả hai là chip trạng thái nền (giờ thế giới ·
         có tiếng hay không), và xếp ngang thì không tốn thêm một dòng chiều cao nào của HUD. -->
    <div id="hud-chip">
      <div id="hud-time" title="Đồng Hồ Thế Giới — bấm mở Bảng Sự Kiện" onclick="openEventBoard()" style="cursor:pointer">⏱ --:--</div>
      <button id="btn-am" type="button" aria-pressed="false" title="Tắt âm thanh (phím L)">🔊</button>
    </div>
  </div>
  <div id="hud-map"></div>
  <div id="hud-right">
    <div id="hud-vi" role="group" aria-label="Ví">
      <button class="vi-o vi-lumen" title="Lumen — tiền chính: tiệm, rèn, nâng kỹ năng. Bấm mở Túi Đồ · Vật Liệu"
              onclick="window.moViTien()"><img class="vi-ic" src="assets/ui/gt_xu_vang.webp" alt=""><b id="hud-silver">0</b></button>
      <button class="vi-o vi-ve" title="Ấn Giao Kết — vé quay Khế Ước Ragoon. Bấm mở bảng Khế Ước"
              onclick="window.openKheUoc()"><img class="vi-ic" src="assets/ui/gt_xu_bac.webp" alt=""><b id="hud-ve">0</b></button>
      <button class="vi-o vi-shard" title="Shard — tiền cao cấp: đổi vé quay, nới túi và kho. Bấm mở Quầy Shard"
              onclick="window.moQuayShard()"><img class="vi-ic" src="assets/ui/gt_ngoc_lam.webp" alt=""><b id="hud-shard">0</b></button>
    </div>
    <button id="btn-pk" class="hbtn pk-off hidden" title="Bật/tắt chế độ PK">PK: Tắt</button>
    <button id="btn-auto" class="hbtn auto-off hidden" title="Tự đánh — treo máy: tự đánh quái & tung kỹ năng quanh điểm neo, tối đa 1-2 bãi (Z)">⚔ AUTO</button>
    <!-- CỘT PHẢI là MỘT khối, không phải ba tấm rời chồng lên nhau. Trước bản này bản đồ nhỏ
         và bảng nhiệm vụ mỗi cái một khung riêng, cách nhau một khe hở để lọt nền map — nên
         chỗ tiếp giáp đổi sáng-tối theo địa hình đang đứng, và hai tấm lúc đọc ra một khối,
         lúc đọc ra hai. Cùng lý do đã ghi ở #bottom-hud và ở khung chân dung. -->
    <div id="cot-phai">
      <!-- DẢI TRẠNG THÁI đứng TRÊN bản đồ nhỏ, không phải dưới: nó là thứ phải liếc thấy
           giữa lúc đánh nhau, mà mắt đi từ trên xuống. Dưới bản đồ đã là hàng nút, và một
           dải icon nhấp nháy xen giữa hai hàng nút thì đọc ra như một hàng nút thứ ba. -->
      <div id="trang-thai" class="trong"></div>
      <div id="minimap-wrap">
        <canvas id="minimap" width="200" height="146" title="Bản đồ thu nhỏ (U)"></canvas>
      </div>
      <!-- Hàng nút dưới bản đồ: đúng ba cửa người chơi mở từ chỗ này. KHÔNG bịa thêm nút cho
           tính năng game chưa có (kênh, chợ…) — nút bấm vào không ra gì thì tệ hơn hẳn không
           có nút. Nút Ẩn dời từ góc canvas xuống đây: nằm trên bản đồ thì nó che mất đúng
           một góc bản đồ, mà góc nào cũng có thể là chỗ người chơi đang cần nhìn. -->
      <div id="mm-nut">
        <button class="cp-nut" title="Bản Đồ (M)" onclick="togglePanel('map')">🗺 Bản Đồ</button>
        <button class="cp-nut" title="Bảng Sự Kiện" onclick="openEventBoard()">⏱ Sự Kiện</button>
        <button class="cp-nut" id="btn-minimap" title="Ẩn/hiện bản đồ thu nhỏ (U)">👁 Ẩn</button>
      </div>
      <!-- NHẬT KÝ NHIỆM VỤ CẮM THẲNG VÀO CỘT, không còn là cửa sổ nổi giữa màn.
           Trước bản này có HAI chỗ nói về nhiệm vụ: bảng theo dõi ở cột phải (mục tiêu đang
           làm) và Nhật Ký mở bằng Q (cả chuỗi, 3 tab) — hai cửa đọc cùng một dữ liệu, và
           người chơi phải nhớ cái nào ở đâu. Nay gộp: khối này CHÍNH LÀ Nhật Ký, và bảng theo
           dõi cũ thành tab đầu của nó.
           ⚠ Nó KHÔNG còn đi qua togglePanel: một khối cắm trong HUD mà mở Túi Đồ là biến mất
           thì đọc ra như lỗi. Phím Q gọi `toggleQlog()` — thu/mở tại chỗ. -->
      <div id="panel-qlog" class="panel bang-cam"></div>
    </div>
  </div>
</div>


<!-- Thanh dưới kiểu MU Online: viên đá Máu (đỏ) + Mana (xanh) hình cầu ở
     2 đầu, thanh kỹ năng dàn ngang ở giữa, viền sáng chạy dọc theo % máu ở mép dưới cùng. -->
<!-- ⚠ HAI TẦNG, KHÔNG PHẢI MỘT HÀNG. Bản trước nhét menu hệ thống xen giữa thanh chiêu —
     tức là nút "Cài Đặt" nằm ngay cạnh nút tung chiêu, cùng cỡ, cùng kiểu. Đang đánh nhau mà
     trượt tay một ô là mở bảng cài đặt. Nay tách hẳn theo lối MU S6:
       · #bottom-hud  = CHIẾN TRƯỜNG — chỉ thứ dùng lúc đánh: hai viên đá, ô chiêu, thuốc, Trợ Thủ
       · #menu-cot    = MENU HỆ THỐNG — cột dọc sát mép phải, thu gọn được về một tab nhỏ -->
<div id="bottom-hud" class="hidden">
  <!-- ⚠ BA CỤM, DÀN ĐỀU HAI BÊN Ô CHIÊU. Chủ dự án đưa ảnh mẫu MU và chốt: "phải dàn trải đều
       2 bên thì UI mới cân đối" — Nhân Vật · Túi Đồ · Kỹ Năng · Nhiệm Vụ sang TRÁI, ô chiêu ở
       GIỮA, Tổ Đội · Hảo Hữu · Bản Đồ · Cài Đặt · Menu ở PHẢI.
       Trước bản này cả chín nút menu dồn hết vào đuôi bên phải: thanh nặng hẳn một bên, và ô
       chiêu — thứ người chơi nhìn nhiều nhất — bị đẩy lệch khỏi tâm màn hình.
       Cụm trái là CỬA (mở bảng của chính mình), cụm phải là NGƯỜI KHÁC + hệ thống. -->
  <div id="mc-trai" class="hidden">
    <button class="mc-btn" id="btn-char"  title="Nhân Vật (C) — chỉ số"><img src="assets/ui/ic_nhanvat.png" alt=""><span>Nhân Vật</span></button>
    <button class="mc-btn" id="btn-bag"   title="Túi Đồ (B)"><img src="assets/ui/ic_tuido.png" alt=""><span>Túi Đồ</span></button>
    <button class="mc-btn" id="btn-skill" title="Kỹ Năng (K)"><img src="assets/ui/ic_kynang.png" alt=""><span>Kỹ Năng</span></button>
    <button class="mc-btn" id="btn-qlog"  title="Nhiệm Vụ (Q)"><img src="assets/ui/ic_nhiemvu.png" alt=""><span>Nhiệm Vụ</span></button>
  </div>
  <i class="sk-vach"></i>
  <div id="skillbar">
    <button class="skill" id="sk-basic"><span class="sk-ico">⚔</span><span class="sk-key">Space</span><span class="sk-cd"></span></button>
    <button class="skill sk-slot" data-slot="0" id="sk-0" title="Chiêu chính"><span class="sk-ico">+</span><span class="sk-key">1</span><span class="sk-cd"></span></button>
    <button class="skill sk-slot" data-slot="1" id="sk-1" title="Chiêu phụ"><span class="sk-ico">+</span><span class="sk-key">2</span><span class="sk-cd"></span></button>
    <button class="skill sk-slot" data-slot="2" id="sk-2" title="Buff"><span class="sk-ico">+</span><span class="sk-key">3</span><span class="sk-cd"></span></button>
    <button class="skill sk-slot" data-slot="3" id="sk-3" title="Tuyệt Chiêu"><span class="sk-ico">+</span><span class="sk-key">4</span><span class="sk-cd"></span></button>
    <i class="sk-vach"></i>
    <!-- Hai ô thuốc, hai phím kề nhau: R hồi máu, T hồi Mana. Lọ Mana nay là món MANG THEO
         (trước đây mua ở tiệm là hồi đầy ngay tại quầy — tức là chỉ dùng được đúng lúc không
         ai cần nó). Cùng trần 5 lọ, cùng nhịp hồi 20s, cùng cách báo hết — xem useManaPot(). -->
    <button class="skill sk-vat" id="sk-thuoc" title="Bình Thuốc Đỏ — hồi 40% máu (R)"><span class="sk-key">R</span><b class="sk-so" id="sk-thuoc-so">0</b></button>
    <button class="skill sk-vat" id="sk-mana" title="Lọ Mana — hồi 40% Mana (T)"><span class="sk-key">T</span><b class="sk-so" id="sk-mana-so">0</b></button>
    <button class="skill" id="sk-loot" title="Nhặt đồ dưới đất (J)"><span class="sk-ico">✋</span><span class="sk-key">J</span><span class="sk-cd"></span></button>
    <i class="sk-vach"></i>
    <button class="skill sk-troly" id="sk-helper" title="Trợ Thủ — bật/tắt TỰ ĐÁNH (Z) · chuột phải để chỉnh"><span class="sk-ico">⚙</span><span class="sk-key">Z</span></button>
  </div>
  <i class="sk-vach"></i>
  <!-- MENU HỆ THỐNG nằm TRÊN THANH CHIẾN ĐẤU, không phải một khối thứ tư trôi ở đáy.
       Chủ dự án chốt: "để UI qua bên phải cho đồng nhất". Trước đó nó đã đi hai chặng —
       cột dọc mép TRÁI, rồi hàng ngang đáy PHẢI — và cả hai đều để nó đứng RIÊNG, tức
       giao diện có thêm một khối nữa phải nhớ chỗ. Nay cả bên phải là MỘT cột: ví, tự
       đánh, bản đồ, nhiệm vụ, rồi menu. -->
  <div id="menu-cot" class="hidden">
    <div id="mc-list">
      <!-- Tổ Đội và Hảo Hữu CHƯA có tranh trong bộ ic_*.png, nên dùng ký hiệu chữ (gold, cùng
           cỡ ô). Đừng mượn tạm một tranh của nút khác: hai nút cùng hình là hai nút không phân
           biệt được, mà nhãn thì chỉ hiện lúc rê chuột. -->
      <button class="mc-btn" id="btn-party"  title="Tổ Đội (P)"><img src="assets/ui/gt_ic_todoi.webp" alt=""><span>Tổ Đội</span></button>
      <button class="mc-btn" id="btn-friend" title="Hảo Hữu (H)"><img src="assets/ui/gt_ic_haohuu.webp" alt=""><span>Hảo Hữu</span></button>
      <button class="mc-btn" id="btn-map"      title="Bản Đồ (M)"><img src="assets/ui/ic_bando.png" alt=""><span>Bản Đồ</span></button>
      <button class="mc-btn" id="btn-settings" title="Cài Đặt (O)"><img src="assets/ui/ic_caidat.png" alt=""><span>Cài Đặt</span></button>
      <!-- ⚠ Ký hiệu là `≡`, KHÔNG phải `☰`. Cái thứ hai trông giống hệt và cũng đọc ra "menu",
           nhưng nó là quẻ Càn của BÁT QUÁI — Quy tắc số 1 cấm motif kiếm hiệp. -->
      <button class="mc-btn mc-menu" id="btn-menu" title="Menu Hệ Thống (F6)">≡<span>Menu Hệ Thống</span></button>
    </div>
    <!-- ⚠ #mc-drop ĐÃ GỠ. Nó là một thả-xuống bốn dòng treo trên nút ≡, và từ lúc có Menu
         Hệ Thống (F6) thì hai trong bốn dòng trùng thẳng với nút trong đó (Bảng Sự Kiện ·
         Hướng Dẫn). Một cái thả-xuống chỉ để chứa hai mục còn lại là một tầng bấm thừa: nay
         nút ≡ mở luôn Menu Hệ Thống. Nhật Ký Chiến Đấu có công tắc riêng ngay trên chính nó,
         Nhạc Nền có thanh trượt trong Cài Đặt — không mục nào mất đường vào. -->
  </div>
  <!-- ⚠ THANH EXP NẰM TRONG #bottom-hud, và đó là cách DUY NHẤT giữ nó bằng ngang dải icon.
       Chủ dự án chốt: "kéo thanh EXP cho bằng ngang dải icon đi". Bề ngang thanh chiến đấu là
       KẾT QUẢ của số ô nhân cỡ ô — không có con số nào chép sang được. Bản cũ khai
       `width: min(520px, 62vw)`, tức một con số rời hẳn: ở màn 1600 nó ra 520px cạnh một thanh
       756px, và mỗi lần thêm hay bớt một ô là hai bên lệch thêm mà không gì báo.
       Cắm vào trong rồi `left:0; right:0` thì hai bề ngang BẰNG NHAU THEO CẤU TRÚC. -->
  <div id="xp-strip" class="hidden"><div class="bar xp"><div id="bar-xp" class="fill"></div><span id="txt-xp"></span></div></div>
</div>

<!-- Tầng Sâu: nút rút lui. Không có nút này thì kho tạm không có cách nào mang về, cả chế độ
     chỉ còn là "cày tới chết" — đúng thứ nó KHÔNG nên là. -->
<button id="deep-leave" class="hidden" onclick="deepLeave()">⬆ RÚT LUI <i>mang kho tạm về</i></button>
<div id="hp-accent-bar"><div id="hp-accent-fill"></div></div>
<!-- Lớp phủ toàn màn hình. Trước đây cả bốn thứ này là createRadialGradient + fillRect(0,0,W,H)
     mỗi khung — bốn lượt tô trọn màn hình cho những gradient KHÔNG hề đổi. Ở đây trình duyệt
     ghép một lần, JS chỉ còn ghi opacity (việc của tầng ghép, không phải tầng tô điểm ảnh). -->
<div id="fx-vignette" class="fx-layer"></div>
<div id="fx-dark" class="fx-layer"></div>
<div id="fx-rays" class="fx-layer"><i></i></div>
<div id="fx-sky" class="fx-layer"></div>
<div id="fx-hurt" class="fx-layer"></div>
<div id="fx-low" class="fx-layer"></div>
<!-- Vết nứt trên trời, rộng thêm theo từng Trụ Khoá bị gỡ. Không phải .fx-layer: nó không phủ
     kín màn hình mà là một VẬT THỂ neo ở mép trên, và nó cần đổi kích thước chứ không chỉ đổi
     độ mờ. JS chỉ ghi data-tru; năm nấc nằm hết trong style.css. -->
<div id="fx-crack" data-tru="0"></div>


<!-- Nhật ký chiến đấu: thay cho số sát thương/thông báo bay đầy màn hình lúc tự đánh nhiều quái —
     gộp lại thành 1 dòng chữ ở góc, đọc được thay vì rối mắt -->
<!-- ⚠ NHẬT KÝ CHIẾN ĐẤU DỜI SANG PHẢI, dưới cột bản đồ. Chủ dự án chốt: bên TRÁI để dành
     cho khung chat giữa người chơi khi có tầng realtime (xem docs/THIET_KE_ONLINE.md — Giai
     đoạn 1 mới chỉ có bóng người, chưa có chat). Ghi lại ở đây để đừng ai dọn nốt sườn trái
     đi: nó đang trống CÓ CHỦ Ý, không phải quên.
     Tiêu đề + nút thu nay nằm NGAY TRÊN cái nhật ký. Trước đó nút thu nằm trong thả xuống của
     nút ≡ — tắt xong thì không còn gì trên màn hình chỉ ra đường bật lại. -->
<div id="combat-log-wrap" class="hidden">
  <div id="cl-dau"><span>Nhật Ký</span>
    <button id="btn-combatlog" title="Thu / mở nhật ký"><i id="cl-arrow">▾</i></button></div>
  <div id="combat-log"></div>
</div>

<!-- CHAT (Giai đoạn 2 online). Góc dưới-TRÁI, đúng khuôn MU — và CỐ Ý tách khỏi Nhật Ký ở
     góc phải: nhật ký là thanh chạy `nowrap` cho đòn của chính mình, chat là hội thoại phải
     xuống dòng và có ô nhập. Gộp hai thứ vào một hộp 190px thì hỏng cả hai.
     ⚠ Khối này chỉ hiện khi có nối mạng (`NET.on`) — xem `chatDung()` trong game.js. Bày một ô
     chat gõ được mà không ai nhận là đúng cái lỗi "một cái vỏ giả vờ là máy chạy". -->
<div id="chat-wrap" class="hidden">
  <div id="chat-tabs">
    <button class="chat-tab on" data-kenh="the-gioi">Thế Giới</button>
    <button class="chat-tab"    data-kenh="vung">Vùng</button>
    <span id="chat-trangthai"></span>
    <button id="chat-thu" title="Thu / mở khung chat"><i>▾</i></button>
  </div>
  <div id="chat-log"></div>
  <input id="chat-input" maxlength="200" autocomplete="off" placeholder="Enter để nói…">
</div>

<!-- Tạo nhân vật — kiểu MU Online: chọn lớp, đặt tên, vào game -->
<!-- Hoạt cảnh mở đầu: biển đêm, bờ xa, ba con tàu. Nằm NGOÀI #sect-select vì trang dẫn
     truyện cũng dùng chung nền này; để bên trong thì .hidden ẩn luôn cả canvas. -->
<canvas id="title-fx" class="hidden"></canvas>
<div id="sect-select" class="hidden">
  <!-- Tranh minh hoạ lớp: hiện khi đã chọn một lớp. Vẽ bằng canvas (splashUrl) -->
  <img id="cc-splash" class="hidden" alt="">
  <!-- SÂN KHẤU MÀN CHỜ — chỉ hiện ở màn DANH SÁCH nhân vật, nơi hàng thẻ 5 lớp đã ẩn đi. Đặt
       ngoài .ss-inner để nó đứng theo mép màn hình chứ không theo cột nội dung 900px, và nằm
       TRƯỚC trong DOM để luôn ở sau danh sách ô.
       Là CANVAS chứ không còn là một tấm PNG: nó vẽ lớp của ô đang chọn kèm con Ragoon của
       nhân vật đó (ccHeroVe trong game.js), và vẽ cả năm lớp khi tài khoản chưa có ai. -->
  <canvas id="cc-hero" class="hidden" width="1000" height="470" aria-hidden="true"></canvas>
  <div class="ss-inner">
    <!-- Không còn khối chữ lớn ở đây. Bức tranh phía sau và năm nhân vật đứng trên phiến đá
         mới là thứ đáng nhìn; chồng thêm một cái tên game cao 74px cùng ba dòng dẫn truyện thì
         chúng chỉ tranh chỗ của nhau. Còn đúng MỘT dòng, và .ss-sub giữ lại làm chỗ báo tin
         (mất nhân vật, đổi phiên bản save) chứ không phải chỗ kể chuyện. -->
    <h2>Lunacia · Bên dưới vết nứt</h2>
    <p class="ss-sub">Bầu trời nứt ra, và ngươi rơi qua.</p>
    <!-- CHỌN MÁY CHỦ — bước đầu tiên, đúng nhịp của MU: tên game dựng to ở giữa, dưới là các
         cụm máy chủ. Chọn xong mới tới danh sách nhân vật. Dựng bằng JS (svRender). -->
    <div id="sv-pick" class="hidden"></div>
    <!-- Năm ô nhân vật (màn chờ). Ẩn khi đang ở màn tạo nhân vật. -->
    <div id="cc-slots"></div>
    <div id="cc-slots-note"></div>
    <div id="cc-classes"></div>
    <div id="cc-detail" class="cc-detail"></div>
    <!-- CHỌN AXIE ĐẠI DIỆN — dựng bằng JS (ccAvaRender).
         Cùng với bảng Khế Ước, đây là cửa người chơi thường có để chọn con Axie của mình:
         trước bản này `player.avatar` chỉ đổi được bằng lệnh gỡ rối `/avatar <id>`, tức mô
         hình đã chốt của game ("Axie là avatar, 5 lớp là sức mạnh") không có mặt nào ở đây.
         Avatar mang 0 chỉ số, 0 kỹ năng, 0 trang bị — nên nó TỰ DO, không khoá theo lớp và
         không khoá theo sở hữu. Cửa chung là avaCamDuoc() trong game.js. -->
    <div id="cc-avatar"></div>
    <div class="cc-name">
      <label for="inp-char-name">Tên nhân vật</label>
      <input id="inp-char-name" maxlength="24" placeholder="Đặt tên cho nhân vật…" autocomplete="off" spellcheck="false">
      <button id="btn-name-random" type="button" title="Gợi ý một cái tên">🎲</button>
    </div>
    <div id="cc-name-warn" class="cc-warn"></div>
    <label id="max-mode" style="display:none"><input type="checkbox" id="chk-max"> Chế độ thử nghiệm — vào game ở cấp tối đa, đầy đủ trang bị &amp; vật liệu</label>
    <button id="btn-create" class="big-btn" disabled>Tạo Nhân Vật</button>
    <button id="btn-continue" class="big-btn hidden">Vào Game</button>
    <button id="btn-newchar" class="big-btn hidden" style="opacity:.8">Tạo Nhân Vật Mới</button>
    <button id="cc-back" class="big-btn" style="display:none;opacity:.8">← Quay Lại Danh Sách</button>
  </div>
</div>
