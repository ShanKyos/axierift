<!doctype html><html lang="vi"><meta charset="utf-8"><title>Magic — vật lý checkpoint 14</title>
<style>body{margin:0;background:#15191f;color:#ddd;font:15px system-ui}main{max-width:1000px;margin:24px auto}h1{font-size:22px}label,button{margin-right:14px}select,button{background:#303743;color:white;border:1px solid #626a78;padding:7px}canvas{background:#20252c;width:720px;max-width:100%;display:block;margin-top:18px}pre{white-space:pre-wrap;color:#99b8ca}</style>
<main><h1>Magic · Kiểm tra vật lý</h1><p>Thân được điều khiển bằng lực motor. Cánh và vũ khí có khối lượng, quán tính; vũ khí thả khi chết. Va chạm quét dùng capsule thân và đoạn kiếm/cạnh cánh.</p>
<label>Hoạt ảnh <select id="state"></select></label><label>Cánh <input id="wing" type="checkbox" checked></label><label>Va chạm <input id="collision" type="checkbox" checked></label>
<label>Quét nhanh <input id="ccd" type="checkbox" checked></label><label>Khối lượng <select id="mass"><option value="1">1×</option><option value="4">4×</option></select></label><button id="kick">Đẩy thân</button><button id="reset">Khởi tạo lại</button>
<canvas id="scene" width="720" height="540"></canvas><pre id="stats">Đang tải art…</pre><p>Đây là bản thử nghiệm vật lý. Chưa nghiệm thu thẩm mỹ và hiệu năng production.</p></main>
<script src="magic-rebuild.js"></script><script src="magic-physics.js"></script><script src="magic-physics-rig.js"></script><script>
(async()=>{const M=MagicRebuild,R=MagicPhysicsRig;await M.load();const state=document.querySelector('#state'),wing=document.querySelector('#wing'),collision=document.querySelector('#collision'),ccd=document.querySelector('#ccd'),mass=document.querySelector('#mass'),canvas=document.querySelector('#scene'),g=canvas.getContext('2d'),stats=document.querySelector('#stats');M.spec.states.forEach(s=>state.add(new Option(s,s)));state.value='dualSlash';const actor={x:0,y:0};let start=performance.now(),P;
function reset(){R.reset(actor);start=performance.now()}document.querySelector('#reset').onclick=reset;[state,wing,collision,ccd,mass].forEach(e=>e.onchange=reset);document.querySelector('#kick').onclick=()=>R.impulse(actor,'spine',[3000,600,0]);
function tick(now){const seconds=(now-start)/1000,frame=state.value==='death'?Math.min(7,Math.floor(seconds*4)):seconds*4%8;g.clearRect(0,0,720,540);g.strokeStyle='#59616c';g.beginPath();g.moveTo(30,470);g.lineTo(690,470);g.stroke();g.save();g.translate(104,10);g.scale(2,2);P=M.render(g,state.value,0,frame,{armor:'ma_thuat',weapon:2,wing:wing.checked?1:null},{poseFilter:R.filter({actor,map:'viewer',time:now,scale:1},{weapon:2,wing:wing.checked?1:null},{collision:collision.checked,ccd:ccd.checked,massScale:Number(mass.value)}),vfx:false});g.restore();stats.textContent=`${P.physics.particles} nút có khối lượng · ${P.physics.constraints} ràng buộc · bước 120 Hz\nSai số chiều dài: ${P.physics.maxLengthError.toFixed(3)} cm · ${P.physics.contacts.length} contact · ${P.physics.ccdHits} va chạm quét\nVũ khí đã thả: ${P.physics.release.L?'có':'chưa'}`;window.__physicsPreview={actor,P};requestAnimationFrame(tick)}requestAnimationFrame(tick);
})().catch(e=>document.querySelector('#stats').textContent=e.stack);
</script></html>
