# Chuyển tiếp WebSocket cho máy chủ Bóng Người.
#
# ⚠ ĐÂY LÀ HAI KHỐI DÁN VÀO HAI CHỖ KHÁC NHAU, không phải một tệp thả vào conf.d.
#   `map` phải nằm ở tầng `http{}`; `location` phải nằm TRONG server block đang chạy
#   (/etc/nginx/sites-available/axiewuxia — xem bản sao ở deploy/nginx-server-block.conf).
#
# Cài:
#   1. chép khối ① vào /etc/nginx/conf.d/axiewuxia-ws.conf   (tầng http, tự được include)
#   2. chép khối ② vào TRONG `server { … }` của sites-available/axiewuxia
#   3. nginx -t  &&  systemctl reload nginx
#
# Kiểm sau khi cài:
#   curl -s http://14.225.204.107/ws/health          → {"ok":true,…}
#   rồi mở game với  http://14.225.204.107/?net=1
#
# ⚠ Bước 2 ĐỘNG VÀO TỆP ĐANG CHẠY. Ngày 31.08 đã một lần mất nginx là mất trang, và cấu hình
#   không có bản sao nào ngoài chính máy. Chép bản cũ ra trước:
#       cp /etc/nginx/sites-available/axiewuxia ~/axiewuxia.nginx.bak
#
# ⚠ Và server block hiện KHÔNG khai `add_header` nào. Đừng thêm vào đó — nginx chỉ kế thừa
#   add_header từ tầng ngoài khi block đó không tự khai cái nào, nên thêm một dòng ở đây là
#   toàn bộ Cache-Control đặt ở tầng http im lặng ngừng áp dụng.


# ─────────── ① tầng http{} ───────────
# WebSocket cần header `Connection: upgrade`, nhưng proxy HTTP/1.1 thường phải gửi
# `Connection: close`. `map` này chọn đúng giá trị theo việc client có xin nâng cấp hay không,
# nên cùng một location phục vụ được cả hai. Đây là khuôn chính thức trong tài liệu nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ─────────── ② trong server{} ───────────
#
# location /ws {
#     proxy_pass http://127.0.0.1:8877;
#     proxy_http_version 1.1;
#     proxy_set_header Upgrade    $http_upgrade;
#     proxy_set_header Connection $connection_upgrade;
#     proxy_set_header Host       $host;
#     proxy_set_header X-Real-IP  $remote_addr;
#     # Không có tin nào chạy qua thì nginx đóng kết nối sau 60 giây mặc định. Máy chủ phát ảnh
#     # chụp 10 Hz nên chuyện đó không xảy ra lúc đang chơi — nhưng người đứng ở màn chọn lớp
#     # thì chưa gửi gì cả. Nới ra cho chắc; client vẫn tự nối lại nếu bị cắt.
#     proxy_read_timeout  600s;
#     proxy_send_timeout  600s;
#     # Tắt đệm: đệm một luồng thời gian thực là cộng thêm độ trễ không vì gì cả.
#     proxy_buffering off;
# }
#
# # /health của máy chủ, để `curl` trong cron kiểm được từ ngoài.
# location = /ws/health {
#     proxy_pass http://127.0.0.1:8877/health;
#     proxy_set_header Host $host;
# }
